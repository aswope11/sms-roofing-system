<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMS Roofing System</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button id="backBtn" class="backbtn" type="button" aria-label="Back" title="Back">&#8249;</button>
  <a href="#/" class="brand">SMS Roofing &amp; Waterproofing</a>
  <input id="search" type="search" placeholder="Search customer, address, tenant, city">
</header>
<nav id="tabs">
  <a href="#/" data-tab="customers">Customers</a>
  <a href="#/schedule" data-tab="schedule">Schedule</a>
  <a href="#/bids" data-tab="bids">Bids</a>
  <a href="#/invoicing" data-tab="invoicing">Invoicing</a>
  <a href="#/supply" data-tab="supply">Supply Houses</a>
  <a href="#/subs" data-tab="subs">Subs</a>
  <a href="#/crew" data-tab="crew">Crew</a>
  <a href="#/shop" data-tab="shop">Shop</a>
</nav>
<div id="crumbs"></div>
<main id="app"></main>
<div id="toast"></div>
<script>
// THE LOCK (11/2/26): if the backend says "sign in", go to the sign-in page and come back here after.
(() => { const f = window.fetch; window.fetch = async (...a) => { const r = await f(...a);
  if (r.status === 401) { try { const d = await r.clone().json(); if (d && d.signin) location.href = '/login.html?back=' + encodeURIComponent(location.pathname + location.search + location.hash); } catch {} }
  return r; }; })();
</script>
<script>document.getElementById('backBtn').onclick = () => { if (history.length > 1) history.back(); else location.hash = '#/'; };</script>
<script type="module" src="app.js"></script>
</body>
</html>
