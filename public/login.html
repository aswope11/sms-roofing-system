<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMS Roofing — Sign in</title>
<style>
  :root{--bg:#12151c;--card:#1a1f29;--panel2:#212734;--ink:#f2f4f8;--mute:#aab6c8;--line:#353e4f;--brand:#ff7a3d;--bad:#ff4d8d;color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;font:20px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;width:min(360px,calc(100vw - 32px));box-sizing:border-box}
  h1{margin:0 0 18px;font-size:24px}
  input{width:100%;box-sizing:border-box;padding:12px;font-size:20px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
  button{margin-top:14px;width:100%;padding:12px;font-size:20px;font-weight:600;border:0;border-radius:8px;background:var(--brand);color:#111;cursor:pointer}
  #msg{margin-top:12px;min-height:1.5em;color:var(--bad)}
</style>
</head>
<body>
<form id="f">
  <h1>SMS Roofing</h1>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus required>
  <button type="submit">Sign in</button>
  <div id="msg"></div>
</form>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg'); msg.textContent = '';
  const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
  if (r.ok) {
    const back = new URLSearchParams(location.search).get('back') || '/';
    location.href = back.startsWith('/') && !back.startsWith('//') ? back : '/';
  } else {
    const d = await r.json().catch(() => ({}));
    msg.textContent = d.error || 'Could not sign in.';
  }
};
</script>
</body>
</html>
